spring:
  datasource:
    url: jdbc:h2:mem:notification-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id: fraud-notification-test
      auto-offset-reset: earliest
  mail:
    host: localhost
    port: 3025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

fraud:
  kafka:
    assessment-topic: fraud.assessments
    assessment-dlt-topic: fraud.assessments.dlt
  notification:
    recipient: ops-test@example.com
    alert-from: alerts-test@example.com
