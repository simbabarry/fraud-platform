server:
  port: ${PORT:8081}

spring:
  application:
    name: fraud-notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:notification_user}
    password: ${SPRING_DATASOURCE_PASSWORD:notification_password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-notification-service
      auto-offset-reset: earliest

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

fraud:
  kafka:
    assessment-topic: ${FRAUD_ASSESSMENT_TOPIC:fraud.assessments}
    assessment-dlt-topic: ${FRAUD_ASSESSMENT_DLT_TOPIC:fraud.assessments.dlt}
  notification:
    recipient: ${FRAUD_ALERT_RECIPIENT:fraud-team@example.com}
    alert-from: ${FRAUD_ALERT_FROM:fraud-alerts@example.com}

logging:
  level:
    com.assessment.notification: INFO
