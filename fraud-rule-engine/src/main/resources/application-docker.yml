# Profile used when the API runs inside the parent Docker Compose stack.
# Container-to-container: fraud-postgres:5432
# Host tools (pgAdmin): localhost:5433 — see ../compose.yaml mapping "5433:5432".
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://fraud-postgres:5432/fraud_db}
    username: ${SPRING_DATASOURCE_USERNAME:fraud_user}
    password: ${SPRING_DATASOURCE_PASSWORD:fraud_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: fraud-rule-engine
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

fraud:
  kafka:
    enabled: true
    transaction-topic: transactions.categorized
    assessment-topic: fraud.assessments
  rules:
    high-risk-countries: KP,SY,IR

server:
  port: 8080

logging:
  level:
    com.assessment.fraud: INFO
